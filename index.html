<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anish | Portfolio</title>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(-15px); opacity: 0.4; }
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fade-in-scale {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes fade-in-left {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* Premium card reveal animation */
      @keyframes card-reveal {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.9);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }
      /* Shimmer sweep effect */
      @keyframes shimmer-sweep {
        0% {
          transform: translateX(-100%) skewX(-15deg);
        }
        100% {
          transform: translateX(100%) skewX(-15deg);
        }
      }
      /* Pulsing glow effect */
      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 20px rgba(145, 94, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 40px rgba(145, 94, 255, 0.4), 0 0 60px rgba(145, 94, 255, 0.2);
        }
      }
      /* Icon float animation */
      @keyframes icon-float {
        0%, 100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-5px) rotate(2deg);
        }
        75% {
          transform: translateY(-5px) rotate(-2deg);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.4s ease-out 0.2s both;
      }
      .animate-fade-in-scale {
        animation: fade-in-scale 0.4s ease-out 0.4s both;
      }
      .animate-fade-in-left {
        animation: fade-in-left 0.4s ease-out 0.6s both;
      }
      /* Premium card styles */
      .premium-card {
        position: relative;
        overflow: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
      }
      .premium-card:hover {
        transform: translateY(-12px) scale(1.02);
        box-shadow: 0 25px 50px rgba(145, 94, 255, 0.3);
      }
      .shimmer-overlay::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(145, 94, 255, 0.1),
          transparent
        );
        animation: shimmer-sweep 3s infinite;
        pointer-events: none;
      }
      .premium-card:hover .shimmer-overlay::before {
        animation: shimmer-sweep 0.8s ease-out;
      }
      .premium-card:hover img {
        animation: icon-float 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
